<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; background: #000; overflow: hidden; }
    .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .feed::-webkit-scrollbar { display: none; }
    .slide { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="feed" id="feed"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const rawList = params.get('v') || '';

    // 1. Keep only valid http/https URLs and remove duplicates
    const videoUrls = [...new Set(
      rawList
        .split(',')
        .map(u => decodeURIComponent(u.trim()))
        .filter(u => u.startsWith('http'))
    )];

    const feed = document.getElementById('feed');

    videoUrls.forEach(url => {
      const slide = document.createElement('div');
      slide.className = 'slide';

      const vid = document.createElement('video');
      vid.src = url;
      vid.playsInline = true;
      vid.loop = true;
      vid.muted = true;
      vid.autoplay = true;
      vid.preload = 'auto';

      // 2. If a link is broken or not a valid video, remove the blank slide automatically
      vid.addEventListener('error', () => {
        slide.remove();
      });

      slide.addEventListener('click', () => {
        vid.muted = !vid.muted;
      });

      slide.appendChild(vid);
      feed.appendChild(slide);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          video.play().catch(() => {});
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }, { threshold: 0.75 });

    document.querySelectorAll('video').forEach(v => observer.observe(v));
  </script>
</body>
</html>
